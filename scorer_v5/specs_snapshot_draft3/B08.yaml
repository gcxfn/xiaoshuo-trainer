metric_id: B08
construct: 主角目标明确度
version: spec-v5.1-draft-2
semantic_definition: >
  先列前 1/3 内所有目标句：台词或明确心理决定，表达主角要达成、守住或查明的具体事项。
  按"贯穿主线且决定终局"的固定规则选择核心目标；没有可选目标则①不成立。
  行动一环是主角方主动选择/发起的事件并产生可观察结果；同一目标、同一时空的连续动作合并，
  独立结果或新选择才另计。主角委托他人只有在正文有可观察委托、结果回到主角决策链时计入。

semantic_outputs:
  # LLM 只提供语义判断与逐字证据；严禁输出 offset/比例/score。
  goals:
    - goal_quote: "目标句逐字引文（前 1/3 内）"
    - is_core: 是否核心目标（贯穿主线且决定终局）
    - chain_actions: "行动环清单：每环 { action_quote, serves_goal, state_before, state_after }"
    - delegated_actions: "代理行动：{ delegate_quote, result_back_quote }"
    - causal_turn_quote: "转折因果句逐字引文（主角行动直接促成）"
  criteria:
    - goal_extractable: ①目标句可摘
    - chain_ge_3: ②行动链 ≥3 环
    - causal_autonomous: ③因果自主（至少一处转折由主角行动促成）

derived_features:
  # 全部 Python 产生。
  - goal_in_first_third: Python 校验 goal_quote 落在前 1/3（用 offset 映射）
  - action_chain_count: 行动环计数（Python 校验 action_quote 可定位后计数，判定 ②≥3）
  - causal_quote_located: Python 校验 causal_turn_quote 可定位
  - criterion_count: ①②③成立计数

score_scale:
  allowed: [0, 1, 3, 5, 7, 9, 10]

ordinal_mapping:
  - three: 10
  - two: 5
  - zero_or_one: 0

mapping_note: >
  spec-v5.1-draft-2 restores the v4.0.0 frozen 0/5/10 branch semantics after
  independent threshold review; no unvalidated intermediate ordinal band is used.

evidence_rule: >
  所有引文必须能在 canonical text 中逐字定位；目标句必须在前 1/3（Python 用 offset 判定）。
  定位失败 → 对应行动环不计入链计数。

abstain_rule: >
  无法确认目标/行动链边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

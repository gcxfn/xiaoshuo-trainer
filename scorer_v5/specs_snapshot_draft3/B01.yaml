metric_id: B01
construct: 异常事件出现位置
version: spec-v5.1-draft-4
semantic_definition: >
  异常事件是打破主角原有日常或预期的外部事件，包括超常设定显形、死亡/逮捕/背叛揭露/
  身份暴露/事故、命运级消息送达等。内部情绪、渐显不适、日常摩擦和单纯内心决定不计。
  按正文顺序列全部候选，取最早满足定义者；同句并发事件按正文首次出现的可观察起点排序，
  无法排序则并列留档。
  记录首个候选的首句、自然段 P、正文码点起点、L、位置比例 q=起点/L，并摘出异常后一个
  可观察行动/决策句及因果窗口。即时改变要求异常后同一场景内，主角在异常之后作出与异常有
  直接连接的行动或决定；仅"感到震惊/害怕"不算。
  判定项：① P≤3；②异常在同一场景内直接改变主角行动/决定；③首句位置 q≤10.00%。

semantic_outputs:
  # LLM 只提供语义判断与逐字证据；严禁输出 offset/比例/score。
  candidates:
    - event_quote: "候选异常事件首句逐字引文，必须能在 canonical text 中逐字找到"
    - nearby_anchor: "邻近锚点/段落证据（可选，帮助 Python 定位）"
    - is_external_event: 是否外部事件（超常显形/死亡/逮捕/背叛揭露/身份暴露/事故/命运消息）
    - same_scene_action: 异常后同一场景内是否有主角直接行动/决定
    - action_quote: "行动/决定句逐字引文（same_scene_action=true 时必填）"
    - qualifies: 是否符合异常事件定义
  selection_note:
    - LLM 列全部候选；Python 按位置排序取最早满足定义者（LLM 不做最早选择）

derived_features:
  # 全部 Python 产生。
  - resolved_offset: Python 在 canonical text 中定位 event_quote 生成的码点偏移
  - resolved_paragraph: Python 由 offset 映射到的自然段号（判定 ①P≤3）
  - L: len(re.sub(r'\s+', '', canonical_text))
  - q: resolved_offset / L（判定 ③q≤10.00%）
  - action_in_scene: Python 校验 action_quote 与 event_quote 是否同一场景（LLM 给场景标记，Python 判定）
  - item_hits: ①②③各自成立（Python 计算，不信任 LLM 汇总）

score_scale:
  allowed: [0, 1, 3, 5, 7, 9, 10]

ordinal_mapping:
  - no_event_or_q_gt_10: 0
  - q_le_10_none: 1
  - q_le_10_one: 3
  - q_le_10_two: 5
  - q_le_10_no_action: 5
  - q_le_10_three: 10

mapping_note: >
  v5.1-draft-4（Step 12.5）正式启用七档。冻结 v4.0.0 边界语义逐字保留：
  无合格异常或 q>10.00%=0；q≤10% 且 ①②③ 全成立=10。
  q≤10% 的中间分支（v4 一律 5）按 ①② 命中数单调细分为 1/3/5：
  0 项=1、1 项=3、2 项=5（含"无行动"情形=5，语义等同 v4 的 5 分支）。
  此为 v5.1 冻结映射，后续修改必须升版本并登记。

evidence_rule: >
  event_quote 与 action_quote 必须能在 canonical text 中逐字定位；Python 定位失败 → 该候选不计。
  Python 用 q 与 P 判定 ①③，②由 LLM 的 same_scene_action + action_quote 提供（Python 校验引文可定位）。

abstain_rule: >
  无法从正文可靠判断候选事件边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

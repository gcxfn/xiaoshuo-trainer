metric_id: B31
construct: 爆发释放强度
version: spec-v5.1-draft-3
semantic_definition: >
  B31 测全书是否存在合格的摊牌清算，不测音量或哭喊。按全局场景清单筛选：主角方与对手方为
  可识别实体并直接对峙；同一空间、实时电话/视频或正文明确即时往返的文字聊天；至少两个
  "行动/陈述→针对回应"交换。预录音播放、事后通报、回忆转述、纯内心和单方自述不计。回合表
  记录回合号、发起实体、目标实体、引文和回应。
  逐场判：①至少两名可识别实体实时完成两回合；②主角方当场执行无法撤回的关系、法律、归属、
  程序或核心资源决定；仅说"我要"而未执行、摔自己物品泄愤不计；③外部具体声响/光影/温度/气味/
  触感/物件状态变化；情绪隐喻和"全场震惊"不计；④场景前有同源矛盾/压迫/损失铺垫。取最高项数，
  所有并列最高场留档；无场或最佳≤1项=0 分，恰 2 项=5 分，≥3 项且含 ①②=10 分，≥3 项缺 ①
  或缺 ②=5 分。

semantic_outputs:
  # LLM 只提供语义判断与逐字证据；严禁输出 offset/比例/score。
  candidates:
    - scene_quote: "摊牌场关键句逐字引文"
    - round1_quote: "①第一回合甲行动/陈述逐字引文"
    - round2_quote: "①乙对甲第一回合的针对性回应逐字引文"
    - round3_quote: "①甲对乙回应的再回应逐字引文（若存在）"
    - round4_quote: "①乙对甲再回应的再回应逐字引文（若存在）"
    - round_count: "逐字可定位的回合数（至少两个完整交换为 ≥4；仅 A→B 为 2，不计入①）"
    - irrevocable_quote: "②不可撤回决定执行逐字引文"
    - sensory_quote: "③外部感官/物件变化逐字引文"
    - foreshadow_quote: "④同源铺垫逐字引文"
    - item_hits: "①②③④分别成立（bool）"
  selection_note:
    - LLM 列候选场并填项；Python 取"项数最多"者（并列场全部留档）

derived_features:
  # 全部 Python 产生。
  - candidate_offsets: Python 定位各候选场 offset
  - best_scene: Python 取项数最多场（并列全部留档）
  - item1_ok: ①成立——Python 校验 round1/round2/round3/round4 引文可定位且按序、round_count ≥4（至少两个完整"行动/陈述→针对回应"交换；仅 A→B 不计入①）
  - item2_ok: ②成立——Python 校验 irrevocable_quote 可定位
  - item3_ok: ③成立——Python 校验 sensory_quote 可定位
  - item4_ok: ④成立——Python 校验 foreshadow_quote 可定位
  - item_count: 最佳场 ①②③④成立计数
  - combo_10: item_count ≥3 且 item1_ok 且 item2_ok
  - combo_5: 恰 2 项，或 ≥3 项但缺 item1 或 item2

score_scale:
  allowed: [0, 1, 3, 5, 7, 9, 10]

ordinal_mapping:
  - no_scene_or_le_one: 0
  - has_one_and_two_and_ge_three: 10
  - other_ge_two: 5

mapping_note: >
  spec-v5.1-draft-3 restores the v4.0.0 frozen 0/5/10 branch semantics after
  independent threshold review: 10 分恢复为 ≥3 项且含 ①②；5 分为恰 2 项或 ≥3 项缺 ①/②；
  0 分为无场或 ≤1 项；并列最高场全部留档（不取首次）。①恢复为至少两个完整"行动/陈述→针对
  回应"交换（round_count ≥4），仅 A→B 不计入①。此为 v5.1 冻结映射。

evidence_rule: >
  所有引文必须能在 canonical text 中逐字定位；round1<round2<round3<round4 按正文顺序。
  候选场选择由 Python 按项数最多执行，并列场全部留档。

abstain_rule: >
  无法确认摊牌场/项边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

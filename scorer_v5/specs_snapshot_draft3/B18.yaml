metric_id: B18
construct: 中段塌陷
version: spec-v5.1-draft-3
semantic_definition: >
  列全文连续场景。开篇钩子是正文顺序中首次使主线冲突可识别的场景，多候选取最早；最终高潮是
  最后一次不可逆确定主线冲突归属/结果的场景，多候选取最晚；无端点则不排除并记录理由，两端
  同场只排除一次。中段为全部场景减去实际识别的端点，报出分母清单。开放结局不能把最后一段
  机械认作高潮。
  每个中段场景填：边界、冲突目标、状态类别、变化前状态、变化后状态、逐字证据、有效性。
  四类为新信息、关系翻转、资源得失、计划进退。只有前后状态不同且有证据才有效；重复施压/拒绝、
  等待、回忆、环境描写和仅有决定准备意图无效。一个场景多类仍只计一个有效场景。
  `无效占比=无效中段场景数/中段总数`，精确比较：≥50% 或连续无效 ≥3 为 0 分；≥25% 且 <50%
  且无连续 ≥3 为 5 分；<25% 为 10 分。中段总数为 0 时记录端点清单，无效数=0、比例约定为 0，
  走 10 分路径，但必须在 held-out 复核。

semantic_outputs:
  # LLM 只提供语义判断与逐字证据；严禁输出 offset/比例/score。
  endpoints:
    - hook_quote: "开篇钩子逐字引文（首次使主线冲突可识别的场景）"
    - climax_quote: "最终高潮逐字引文（最后一次不可逆确定主线冲突归属/结果的场景）"
  middle_scenes:
    - scene_quote: "中段场景逐字引文"
    - state_before: 状态前
    - state_after: 状态后
    - state_axis: "状态类别（新信息/关系翻转/资源得失/计划进退）"
    - valid: 前后状态是否不同且可验证（LLM 判定，Python 校验引文）
  selection_note:
    - LLM 列端点与中段场景；Python 判定端点选取（最早/最晚）、中段分母、占比与连续段

derived_features:
  # 全部 Python 产生。
  - hook_offset: Python 定位 hook_quote
  - climax_offset: Python 定位 climax_quote
  - middle_scene_count: 中段场景数（分母 = 全部场景 - 实际识别端点；Python 校验 scene_quote 落在中段区间）
  - valid_count: 有效场景数（LLM 判 valid，Python 校验引文）
  - invalid_ratio: 无效占比（无效/总，判定 ≥50% 塌陷、≥25% 轻度）
  - consecutive_invalid: 连续无效最大长度（判定 ≥3）

score_scale:
  allowed: [0, 1, 3, 5, 7, 9, 10]

ordinal_mapping:
  - invalid_ge_50_or_consecutive_ge_3: 0
  - invalid_ge_25_lt_50: 5
  - invalid_lt_25: 10

mapping_note: >
  spec-v5.1-draft-3 restores the v4.0.0 frozen 0/5/10 branch semantics after
  independent threshold review: 端点恢复为"首次使主线冲突可识别"与"最后一次不可逆确定主线
  结果"；中段分母为全部场景减实际识别端点；阈值恢复为精确比较 ≥50%/≥25%/<25%（非严格
  >50%/>25%）；中段总数为 0 时走 10 分路径并在 held-out 复核。此为 v5.1 冻结映射。

evidence_rule: >
  hook_quote / climax_quote / scene_quote 必须能在 canonical text 中逐字定位；
  场景落在中段区间（Python 用 offset 判定）才计入分母；定位失败 → 该场景不计。

abstain_rule: >
  无法确认端点/场景边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

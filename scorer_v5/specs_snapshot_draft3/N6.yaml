metric_id: N6
construct: 对话潜台词密度
version: spec-v5.1-draft-4
semantic_definition: >
  潜台词事件至少含两个"甲可识别陈述/行动→乙针对性回应"的回合，且同一组交换满足：表层字面
  与真实意图相反或显著超出；真实意图至少由动作、第三方反应或后文明确揭示之一支持；交换围绕
  同一博弈目标，连续对话只计一件，出现新博弈目标才拆为新件。广播、单方独白、仅读者推断的
  机锋不计。与 B02 的区别是 N6 必须满足言此意彼和解码证据，B02 只需立场对抗。

semantic_outputs:
  # LLM 只提供语义判断与逐字证据；严禁输出 L/K/F/offset/score。
  events:
    - round_quotes: "两回合逐字引文（[甲句, 乙句]），必须能在 canonical text 中逐字找到"
    - nearby_anchor: "邻近锚点/段落证据（可选，帮助 Python 定位；可以是段首句或唯一短语）"
    - literal_meaning: 表层字面意
    - real_meaning: 真实意图
    - decoding_evidence: "解码证据逐字引文（动作/第三方反应/后文揭示）"
    - game_goal: 博弈目标描述（用于合并：同一目标连续对话只计一件）
    - qualifies: 是否符合 N6 定义（两回合+言此意彼+解码证据）
  exclude_notes:
    - 广播/单方独白/仅读者推断的机锋，标记为不计

derived_features:
  # 全部 Python 产生；LLM 不报 offset。
  - resolved_start_offset: Python 在 canonical text 中定位 round_quotes[0] 生成的起始偏移
  - resolved_end_offset: Python 定位 round_quotes[-1] 结束生成的结束偏移
  - N: 事件件数（Python 按 resolved 位置区间 + game_goal 合并去重后计数）
  - L: len(re.sub(r'\s+', '', canonical_text))
  - K: L/1000
  - F: N / K（保存原始连续值，两位小数展示）

score_scale:
  allowed: [0, 1, 3, 5, 7, 9, 10]

ordinal_mapping:
  - F_lt_0_20: 0
  - F_ge_0_20_lt_0_30: 1
  - F_ge_0_30_lt_0_40: 3
  - F_ge_0_40_lt_0_50: 5
  - F_ge_0_50_lt_0_65: 7
  - F_ge_0_65_lt_0_80: 9
  - F_ge_0_80: 10

mapping_note: >
  v5.1-draft-4（Step 12.5）正式启用七档。冻结 v4.0.0 边界语义逐字保留：F<0.20=0、
  F≥0.50=10 原封不动；0.20≤F<0.50 冻结 5 分支内按 F 单调细分为 1/3/5；
  F≥0.50 冻结 10 分支内按 F 单调细分为 7/9/10。连续原始值 F 始终保留。
  此为 v5.1 冻结映射，后续修改必须升版本并登记。

evidence_rule: >
  LLM 输出的 round_quotes 与 decoding_evidence 必须能在 canonical text 中逐字定位；
  Python 定位失败（引文不在正文/截断/改写）→ 该件标记 evidence_mismatch，不计入 N。
  每件必须有 resolved_start_offset < resolved_end_offset，区间重叠或缺失报校验失败。
  N 合并：先按 game_goal 分组，同组内区间重叠/相邻的事件合并为一件。

abstain_rule: >
  正文为空或 K=0 时输入无效，不输出分数（构建侧拒绝）。
  无法确认事件边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

event_schema:
  - round_quotes: 两回合逐字引文数组（无 offset 字段）
  - nearby_anchor: 邻近锚点（可选）
  - literal_meaning: 字面意
  - real_meaning: 真实意
  - decoding_evidence: 解码证据
  - game_goal: 博弈目标
  - qualifies: 是否符合定义

metric_id: B09
construct: 核心冲突强度
version: spec-v5.1-draft-2
semantic_definition: >
  使用全局主线冲突清单，禁止用结局结果反推未建立的矛盾。利害对象采用题材中立的状态轴：
  人身安全/自由、关系归属、资源控制、名誉或制度资格。
  等级：L3=已发生或迫近的死亡、长期剥夺自由、子女/身份归属丧失、终身性损害、实质名誉/制度资格
  毁灭或同等不可逆后果；L2=重大财产/资源损失、婚姻或关键关系存废、长期但可逆的人身/资格限制；
  L1=短期口角、轻微利益、一般面子或可即时修复的摩擦。等价结构按后果而非题材命名映射。

semantic_outputs:
  # LLM 只提供语义判断与逐字证据；严禁输出 offset/比例/score。
  main_conflict:
    - conflict_quote: "主线冲突建立场景逐字引文"
    - stake_state_before: 利害对象状态前
    - stake_state_after: 利害对象状态后
    - stake_level: "利害等级（L1/L2/L3，题材中立状态轴映射）"
    - zero_sum: ②零和判定（双方争夺同一不可并存状态控制权，无共同实现路径）
    - zero_sum_quote: 零和引文
    - idle_segments: "无冲突连续区段清单（{ start_quote, end_quote }，LLM 标区段，Python 算比例）"

derived_features:
  # 全部 Python 产生。
  - stake_ge_l3: ①利害≥L3（LLM 判 L 级，Python 布尔校验）
  - zero_sum_flag: ②零和（LLM 判定，Python 校验引文可定位）
  - idle_gap_ratio: Python 用 idle_segments 的 offset 区间算"最大单一连续无冲突区段"长度 / L（判定 ③≤30.00%，不把多个分离区段相加）
  - criterion_count: ①②③成立计数

score_scale:
  allowed: [0, 1, 3, 5, 7, 9, 10]

ordinal_mapping:
  - three: 10
  - two: 5
  - zero_or_one: 0

mapping_note: >
  spec-v5.1-draft-2 restores the v4.0.0 frozen 0/5/10 branch semantics after
  independent threshold review; no unvalidated intermediate ordinal band is used.

evidence_rule: >
  conflict_quote / zero_sum_quote 必须能在 canonical text 中逐字定位；
  idle_segments 的 start_quote/end_quote 必须可定位（Python 据此算区间长度与占比）。

abstain_rule: >
  无法确认利害等级/零和/区段边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

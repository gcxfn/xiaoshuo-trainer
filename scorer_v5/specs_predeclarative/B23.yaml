metric_id: B23
construct: 主角能动性
version: spec-v5.1-draft-4
semantic_definition: >
  主动行动是主角方主动选择/发起的事件并产生可观察结果；结果表现为对手/世界状态的可验证改变
  （反应、让步、受损、计划落空、环境变化等），但单纯内心活动、被动接话或唯一结果是"产生新
  情绪"不计。同一目标、同一时空的连续动作合并为一件；独立结果或新选择才另计。
  ①主动行动计数 ≥5；②递进链 ≥2（后行动依赖/升级前行动的结果，输入链两端证据）；
  ③终局主动（决定性场面由主角发起，而非被动反应）。

semantic_outputs:
  # LLM 只提供语义判断与逐字证据；严禁输出 offset/比例/score。
  actions:
    - action_quote: "主动行动句逐字引文"
    - observable_result: "可观察结果逐字引文（对手/世界状态改变）"
    - chain_link: "递进链标记（本行动是否依赖/升级上一行动结果）"
    - finale_initiative_quote: "终局发起句逐字引文（③，若有）"
  criteria:
    - count_ge_5: ①主动行动 ≥5
    - chain_ge_2: ②递进链 ≥2
    - finale_active: ③终局主动

derived_features:
  # 全部 Python 产生。
  - action_count: 主动行动计数（Python 按引文定位 + 结果校验后计数，判定 ①≥5）
  - chain_length: 递进链最长长度（Python 按 chain_link 序列计算，判定 ②≥2）
  - finale_quote_located: Python 校验 finale_initiative_quote 可定位
  - criterion_count: ①②③成立计数

score_scale:
  allowed: [0, 3, 5, 10]

ordinal_mapping:
  - zero: 0
  - one: 3
  - two: 5
  - three: 10

mapping_note: >
  v5.1-draft-4（Step 12.5）正式启用七档。冻结 v4.0.0 边界语义逐字保留：0-1项=0、3项=10
  原封不动；冻结 5 分支（2项）细分为 1=3、2=5。计数项至多 3 个成立，仅 4 个可达状态
  （0/3/5/10），故无 7/9 档。此为 v5.1 冻结映射，后续修改必须升版本并登记。

evidence_rule: >
  action_quote / observable_result 必须能在 canonical text 中逐字定位；
  缺 observable_result 的 action 不计入①。链长由 Python 按 LLM 的 chain_link 序列计算。

abstain_rule: >
  无法确认行动边界/结果、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

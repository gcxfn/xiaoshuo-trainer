metric_id: N6
construct: 对话潜台词密度
version: spec-v5.1-draft-9
semantic_definition: '潜台词事件至少含两个"甲可识别陈述/行动→乙针对性回应"的回合，且同一组交换满足：表层字面 与真实意图相反或显著超出；真实意图至少由动作、第三方反应或后文明确揭示之一支持；交换围绕
  同一博弈目标，连续对话只计一件，出现新博弈目标才拆为新件。广播、单方独白、仅读者推断的 机锋不计。与 B02 的区别是 N6 必须满足言此意彼和解码证据，B02
  只需立场对抗。只输出 qualifies=true 的事件；不合格候选不要列入。确认没有符合定义的事件时，status=OK 且 events=[]，不是 ABSTAIN。

  '
semantic_outputs:
  events:
  - round_quotes: 两回合对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）（[甲句, 乙句]），必须能在 canonical text 中逐字找到
  - nearby_anchor: 邻近锚点/段落证据（可选，帮助 Python 定位；可以是段首句或唯一短语）
  - literal_meaning: 表层字面意
  - real_meaning: 真实意图
  - decoding_evidence: 解码证据对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）（动作/第三方反应/后文揭示）
  - game_goal: 博弈目标描述（用于合并：同一目标连续对话只计一件）
  - qualifies: 是否符合 N6 定义（两回合+言此意彼+解码证据）
  exclude_notes:
  - 广播/单方独白/仅读者推断的机锋，标记为不计
derived_features:
- resolved_start_offset: Python 在 canonical text 中定位 round_quotes[0] 生成的起始偏移
- resolved_end_offset: Python 定位 round_quotes[-1] 结束生成的结束偏移
- N: 事件件数（Python 按 resolved 位置区间 + game_goal 合并去重后计数）
- L: len(re.sub(r'\s+', '', canonical_text))
- K: L/1000
- F: N / K（保存原始连续值，两位小数展示）
score_scale:
  allowed:
  - 0
  - 1
  - 3
  - 5
  - 7
  - 9
  - 10
ordinal_mapping:
- score: 0
  when:
    field: F
    op: lt
    value: 0.2
- score: 1
  when:
    and:
    - field: F
      op: gte
      value: 0.2
    - field: F
      op: lt
      value: 0.3
- score: 3
  when:
    and:
    - field: F
      op: gte
      value: 0.3
    - field: F
      op: lt
      value: 0.4
- score: 5
  when:
    and:
    - field: F
      op: gte
      value: 0.4
    - field: F
      op: lt
      value: 0.5
- score: 7
  when:
    and:
    - field: F
      op: gte
      value: 0.5
    - field: F
      op: lt
      value: 0.65
- score: 9
  when:
    and:
    - field: F
      op: gte
      value: 0.65
    - field: F
      op: lt
      value: 0.8
- score: 10
  when:
    field: F
    op: gte
    value: 0.8
mapping_note: 'v5.1-draft-4（Step 12.5）全七档，冻结 v4.0.0 边界语义逐字保留： F<0.20=0、F≥0.80=10。
  断点与 draft-3 快照一致：0.20/0.30/0.40/0.50/0.65/0.80 → 0/1/3/5/7/9/10。冻结 10 分支（F≥0.50）内部细分为 7/9/10
  保持快照断点。连续原始值 F 始终保留。 此为 v5.1 冻结映射，后续修改必须升版本并登记。
  （draft-4 Step 12.5 Step 4：ordinal_mapping 为声明式条件，阈值/断点全部在 YAML 中，ordinal.py 为通用解释器，不再硬编码阈值。）'
evidence_rule: '通用 *_quote 输出规则：quote 必须是 canonical text 连续逐字子串；优先最短且足以证明判定的片段；禁止跨位置拼接；禁止用 …… 或 ... 省略；禁止改写、概括、纠正标点或更换中文/英文引号；必须单行、禁止换行；需要两处证据时分放不同 quote 字段或数组项。若该引文可能在正文中出现多次（短句/常用词/无标点片段），必须同时提供 nearby_anchor（邻近唯一上下文片段的 span 编号），帮助 Python 唯一定位；未提供导致歧义拒绝时该证据作废。 LLM 输出的 round_quotes 与 decoding_evidence 必须能在 canonical text 中逐字定位；
  Python 定位失败（引文不在正文/截断/改写）→ 该件标记 evidence_mismatch，不计入 N。 每件必须有 resolved_start_offset
  < resolved_end_offset，区间重叠或缺失报校验失败。 N 合并：先按 game_goal 分组，同组内区间重叠/相邻的事件合并为一件。
  Python 生成 evidence_span_id 为每个 quote item 分配精确整数 span ID（从 round_quotes 数组位置计算），并在 provenance 中记录 wire_output 与 bound_semantic 同时。
  '
abstain_rule: '正文为空或 K=0 时输入无效，不输出分数（构建侧拒绝）。 无法确认事件边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  确认没有任何潜台词事件应输出 OK 且 events=[]，不是 ABSTAIN。
  ABSTAIN 不自动转 0，单独统计 abstention_rate。

  '
event_schema:
- round_quotes: 两回合对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）数组（无 offset 字段），元素必须为整数 span id
- nearby_anchor: 邻近锚点（可选，整数 span id）
- literal_meaning: 字面意
- real_meaning: 真实意
- decoding_evidence: 解码证据（整数 span id）
- game_goal: 博弈目标
- qualifies: 是否符合定义
- evidence_span_id: 程序回填后记录的精确整数 span ID（provenance 只读）

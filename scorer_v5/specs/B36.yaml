metric_id: B36
construct: 共鸣触发器
version: spec-v5.1-draft-9
semantic_definition: '删除"现实关系原型才计"的题材门槛。B36 扫描的是可观察的关系冲突轴，任何现实、幻想、悬疑、 职场、行动或制度环境均可通过等价状态证据计入；纯背景设定、抽象主题或一句评价不计。每类
  至少一处有人物/实体、事件动作和直接后果的场景。 六个互斥优先归类轴：P1 偏置/区别对待（同等资格被不平等分配）；P2 背叛/边界越界（承诺、 关系或授权被破坏）；P3
  不公/污蔑/替代（责任、身份、成果或资格被错误归属）；P4 强制义务/ 情感或信念绑架（以关系、道德、制度或信仰压迫选择）；P5 权力不对等伤害/排斥（利用权力施压、
  剥削、封锁或集体排除）；P6 付出/贡献被抹除（可观察劳动或牺牲被隐匿、挪用或不承认）。 同一事件命中多个轴时，按"直接后果最具体"的一个主轴归类；并列时依 P1→P6
  固定顺序， 不能重复计类。 ①命中至少 2 个不同轴；②核心驱动：至少一个命中轴与全局主线候选的状态变化同源，且至少 两个主线场景由该轴冲突直接改变目标、关系、资源或计划；③跨轴广度：命中轴中至少包含一个
  P1/P3/P4，或在不使用这些名称时由同等的偏置、不公替代或强制义务状态逐字证明。③不是受众 "广谱"判断，而是文本内第二个关系冲突轴的固定映射。

  '
semantic_outputs:
  axes:
  - axis: P1-P6 轴编号（互斥优先归类，直接后果最具体者为主）
  - axis_quote: 该轴支撑对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）（场景含人物/实体+事件动作+直接后果）
  - is_core: ②该轴是否与主线冲突同源（核心驱动）
  - core_scene_quotes: ②该轴直接改变主线目标/关系/资源/计划的主线场景引文（至少两个）
  - breadth_note: ③是否覆盖 P1/P3/P4 之一（或同等偏置/不公替代/强制义务状态）
  criteria:
  - count_ge_2: ①≥2 轴
  - core_drive: ②核心驱动（任一轴与主线同源且 ≥2 个主线场景由该轴改变）
  - breadth: ③跨轴广度（含 P1/P3/P4）
derived_features:
- axis_count: 轴计数（Python 按 LLM 的 axes 清单去重后计数，判定 ①≥2）
- core_drive_flag: ②（LLM 判 is_core + core_scene_quotes；Python 校验引文可定位且 ≥2 个场景）
- breadth_flag: ③（Python 检查 axes 编号是否含 P1/P3/P4）
- criterion_count: ①②③成立计数
score_scale:
  allowed:
  - 0
  - 1
  - 3
  - 5
  - 7
  - 9
  - 10
ordinal_mapping:
- score: 0
  when:
    field: criterion_count
    op: eq
    value: 0
- score: 1
  when:
    field: criterion_count
    op: eq
    value: 1
- score: 3
  when:
    and:
    - field: criterion_count
      op: eq
      value: 2
    - field: axis_count
      op: lt
      value: 4
- score: 5
  when:
    and:
    - field: criterion_count
      op: eq
      value: 2
    - field: axis_count
      op: gte
      value: 4
- score: 7
  when:
    and:
    - field: criterion_count
      op: eq
      value: 3
    - field: axis_count
      op: lt
      value: 4
- score: 9
  when:
    and:
    - field: criterion_count
      op: eq
      value: 3
    - field: axis_count
      op: gte
      value: 4
    - field: axis_count
      op: lt
      value: 5
- score: 10
  when:
    and:
    - field: criterion_count
      op: eq
      value: 3
    - field: axis_count
      op: gte
      value: 5
mapping_note: 'v5.1-draft-4（Step 12.5 二次修订：用户裁定全七档）。0=count0 冻结置顶；1=count1；
  3=count2 且轴<4；5=count2 且轴≥4；7=count3 且轴<4；9=count3 且轴≥4 但<5（未达极值）；10=count3 且轴≥5（极值）。
  7/9 细分依据：criterion_count 定档位，axis_count 定强弱（count2/3 各拆弱/强）；极值阈值 5 登记于此。
  单调：档位越高越接近 10。语义：0 分支保留冻结（count0），10 分支由 count3 扩展为 count3+轴极值。


  （draft-4 Step 12.5 Step 4：ordinal_mapping 为声明式条件，阈值/断点全部在 YAML 中，ordinal.py 为通用解释器，不再硬编码阈值。）'
evidence_rule: '通用 *_quote 输出规则：quote 必须是 canonical text 连续逐字子串；优先最短且足以证明判定的片段；禁止跨位置拼接；禁止用 …… 或 ... 省略；禁止改写、概括、纠正标点或更换中文/英文引号；必须单行、禁止换行；需要两处证据时分放不同 quote 字段或数组项。若该引文可能在正文中出现多次（短句/常用词/无标点片段），必须同时提供 nearby_anchor（邻近唯一上下文片段的 span 编号），帮助 Python 唯一定位；未提供导致歧义拒绝时该证据作废。 B36 短引文约束：axis_quote 仅证明轴存在的短原句；core_scene_quotes 每个元素为独立短句；禁止场景总结式长引文。 axis_quote 必须能在 canonical text 中逐字定位；定位失败 → 该轴不计入①。 轴编号必须是 P1-P6 之一（Python
  校验枚举）；core_scene_quotes 必须可定位且位于不同主线场景。

  '
abstain_rule: '无法确认轴归类/支撑证据、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN； ABSTAIN 不自动转 0，单独统计 abstention_rate。

  '

metric_id: B33
construct: 小爽点密度
version: spec-v5.1-draft-9
semantic_definition: '独立小爽点必须同时满足胜负可见、主角方主动、当场闭环。胜负证据至少一类：A1对手受挫 反应（语塞、改口、僵住、退让、离场或计划落空）；A2对手基于假象信任/得意/放松/轻敌；A3第
  三方明确倒向主角方或质疑对手；A4主角方当场取得钱、证据、地位、承诺或关键信息。每类须逐字 证据。
  你判断：胜负可见、主角主动、当场闭环。终局排除由程序根据 finale_quote 完成，不要因终局位置把 qualifies 判否。
  终局按全局主线规则：最后一个改变主线最终归属/结果的冲突目标场景；开放结局、无明确最终归属、或无法识别唯一终局时，finale_quote=null，不排除任何场景，不是 ABSTAIN。
  事件按因果连续段合并：同一主动动作及连续反应只计 1；新的主角 主动行动且产生独立 A 结果才新计；计划、内心嘲讽、离开且无 A 证据不计。
  确认没有合格事件时，status=OK 且 events=[]，不是 ABSTAIN。

  '
semantic_outputs:
  finale_quote: 主线终局场景对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）（最后一个改变主线最终归属/结果的冲突目标场景）；开放结局或无明确最终归属时为 null（无可识别终局，不排除任何场景）
  events:
  - active_action_quote: 主角主动动作对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段），必须能在 canonical text 中逐字找到
  - nearby_anchor: 邻近锚点/段落证据（可选，帮助 Python 定位）
  - a_code: A 证据代码（A1/A2/A3/A4）
  - a_quote: A 证据对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段），必须能在 canonical text 中逐字找到
  - qualifies: 是否符合小爽点定义（胜负可见+主角主动+当场闭环）；终局排除由程序根据 finale_quote 完成，LLM 不判断终局外
  exclude_notes:
  - 计划/内心嘲讽/离开且无 A 证据，标记为不计
derived_features:
- resolved_start_offset: Python 在 canonical text 中定位 active_action_quote 生成的起始偏移
- resolved_end_offset: Python 定位 a_quote 引文结束生成的结束偏移
- finale_start: Python 定位 finale_quote 生成的终局起点偏移（finale_quote 为 null 时不排除任何事件）
- is_finale: Python 判断事件是否落在 finale_start 之后（终局事件不计入 N）
- N: 独立小爽点件数（按 resolved 位置区间因果连续段合并、排除终局后计数）
- L: len(re.sub(r'\s+', '', canonical_text))
- K: L/1000
- F: N / K（保存原始连续值，两位小数展示）
score_scale:
  allowed:
  - 0
  - 1
  - 3
  - 5
  - 7
  - 9
  - 10

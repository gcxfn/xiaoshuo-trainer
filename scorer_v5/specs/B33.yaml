mapping_note: 'v5.1-draft-4（Step 12.5）全七档，冻结 v4.0.0 边界语义逐字保留： F<0.60=0、F≥1.80=10。
  断点与 draft-3 快照一致：0.60/0.75/0.90/1.20/1.50/1.80 → 0/1/3/5/7/9/10。终局排除改为语义终局：
  LLM 输出 finale_quote（最后一个改变主线归属/结果的场景）；开放结局为 null 不排除。此为 v5.1
  冻结映射，后续修改必须升版本并登记。'
evidence_rule: '通用 *_quote 输出规则：quote 必须是 canonical text 连续逐字子串；优先最短且足以证明判定的片段；禁止跨位置拼接；禁止用 …… 或 ... 省略；禁止改写、概括、纠正标点或更换中文/英文引号；必须单行、禁止换行；需要两处证据时分放不同 quote 字段或数组项。若该引文可能在正文中出现多次（短句/常用词/无标点片段），必须同时提供 nearby_anchor（邻近唯一上下文片段的 span 编号），帮助 Python 唯一定位；未提供导致歧义拒绝时该证据作废。 B33 短引文约束：active_action_quote/a_quote/finale_quote 必须单行、禁止换行、建议 10–60 字、最短片段；允许去掉外围中文引号复制内部文字（须仍为原文连续子串）；finale_quote 只给一行短锚点。 LLM 输出的 active_action_quote、a_quote 与 finale_quote 引文必须能在 canonical text 中逐字定位；
  Python 定位失败 → 该件标记 evidence_mismatch，不计入 N。 每件必须有 resolved_start_offset < resolved_end_offset，区间重叠或缺失报校验失败。
  终局事件（resolved_start_offset ≥ finale_start）不计入 N；finale_quote 为 null（开放结局/无明确最终归属）时不排除任何事件。

  '
abstain_rule: 'K=0 时输入无效（构建侧拒绝）。 无法确认事件边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  无法识别唯一终局应 finale_quote=null 并继续列出事件，不是 ABSTAIN。
  确认没有任何合格事件应输出 OK 且对应事件数组为空，不是 ABSTAIN。 ABSTAIN
  不自动转 0，单独统计 abstention_rate。

  '
event_schema:
- active_action_quote: 主角主动动作对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）（无 offset 字段）
- nearby_anchor: 邻近锚点（可选）
- a_code: A 证据代码（A1/A2/A3/A4）
- a_quote: A 证据对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）
- qualifies: 是否符合定义

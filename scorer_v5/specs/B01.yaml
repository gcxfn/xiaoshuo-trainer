metric_id: B01
construct: 异常事件出现位置
version: spec-v5.1-draft-9
semantic_definition: '异常事件是打破主角原有日常或预期的外部事件，包括超常设定显形、死亡/逮捕/背叛揭露/
  身份暴露/事故、命运级消息送达等。内部情绪、渐显不适、日常摩擦和单纯内心决定不计。
  按正文顺序列全部候选；同句并发事件按正文首次出现的可观察起点排序，无法排序则并列留档。
  你的任务：找出候选异常事件，给出对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段），判断是否外部事件，判断异常后同一场景内是否有主角直接行动/决定
  （仅感到震惊/害怕不算），并摘出该行动/决定句。不要计算或输出自然段号、码点位置、L、q 或比例；这些由程序完成。
  确认没有符合定义的候选时，status=OK 且 candidates=[]，不是 ABSTAIN。

  '
semantic_outputs:
  candidates:
  - event_quote: 候选异常事件首句对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段），必须能在 canonical text 中逐字找到
  - nearby_anchor: 邻近锚点/段落证据（可选，帮助 Python 定位）
  - is_external_event: 是否外部事件（超常显形/死亡/逮捕/背叛揭露/身份暴露/事故/命运消息）
  - same_scene_action: 异常后同一场景内是否有主角直接行动/决定
  - action_quote: 行动/决定句对应 evidence span 的整数编号（程序用 span 原文回填的逐字片段）（same_scene_action=true 时必填；false 时为 null）
  - qualifies: 是否符合异常事件定义
  selection_note:
  - LLM 列全部候选；Python 按位置排序取最早满足定义者（LLM 不做最早选择）
derived_features:
- resolved_offset: Python 在 canonical text 中定位 event_quote 生成的码点偏移
- resolved_paragraph: Python 由 offset 映射到的自然段号（判定 ①P≤3）
- L: len(re.sub(r'\s+', '', canonical_text))
- q: resolved_offset / L（判定 ③q≤10.00%）
- action_in_scene: Python 校验 action_quote 与 event_quote 是否同一场景（LLM 给场景标记，Python 判定）
- item_hits: ①②③各自成立（Python 计算，不信任 LLM 汇总）
score_scale:
  allowed:
  - 0
  - 1
  - 3
  - 5
  - 7
  - 9
  - 10
ordinal_mapping:
- score: 0
  when:
    or:
    - field: event_count
      op: eq
      value: 0
    - field: q
      op: gt
      value: 0.1
- score: 1
  when:
    and:
    - field: q
      op: lte
      value: 0.1
    - field: item_hits_count
      op: eq
      value: 1
- score: 3
  when:
    and:
    - field: q
      op: lte
      value: 0.1
    - field: item_hits_count
      op: eq
      value: 2
    - field: q
      op: gt
      value: 0.05
- score: 5
  when:
    and:
    - field: q
      op: lte
      value: 0.05
    - field: item_hits_count
      op: eq
      value: 2
    - field: q
      op: gt
      value: 0.025
- score: 7
  when:
    and:
    - field: q
      op: lte
      value: 0.025
    - field: item_hits_count
      op: eq
      value: 2
- score: 9
  when:
    and:
    - field: q
      op: lte
      value: 0.1
    - field: item_hits_count
      op: eq
      value: 3
    - field: q
      op: gt
      value: 0.025
- score: 10
  when:
    and:
    - field: q
      op: lte
      value: 0.025
    - field: item_hits_count
      op: eq
      value: 3
mapping_note: 'v5.1-draft-4（Step 12.5 二次修订：用户裁定全七档）。冻结 v4.0.0 边界语义逐字保留： 无合格异常或
  q>10.00%=0；q≤10% 且 ①②③ 全成立=10（此处 10 细分为 q≤2.5% 且 3 项）。 冻结 5 分支（q≤10% 未同时满足①②）内按
  ①②命中数 + q 位置单调细分：2项且 q≤2.5%=7、2项且 2.5%<q≤5%=5、2项且 5%<q≤10%=3、1项=1。3项且 2.5%<q≤10%=9。
  此为 v5.1 冻结映射，后续修改必须升版本并登记。'
evidence_rule: '通用 *_quote 输出规则：quote 必须是 canonical text 连续逐字子串；优先最短且足以证明判定的片段；禁止跨位置拼接；禁止用 …… 或 ... 省略；禁止改写、概括、纠正标点或更换中文/英文引号；必须单行、禁止换行；需要两处证据时分放不同 quote 字段或数组项。若该引文可能在正文中出现多次（短句/常用词/无标点片段），必须同时提供 nearby_anchor（邻近唯一上下文片段的 span 编号），帮助 Python 唯一定位；未提供导致歧义拒绝时该证据作废。 B01 短引文约束：event_quote 只取首次成立异常事件的核心短句；action_quote 只取主角行动/决定的核心短句。 event_quote 与 action_quote 必须能在 canonical text 中逐字定位；Python 定位失败 →
  该候选不计。 Python 用 q 与 P 判定 ①③，②由 LLM 的 same_scene_action + action_quote 提供（Python
  校验引文可定位）。

  '
abstain_rule: '无法从正文可靠判断候选事件边界、缺少必要证据、两种解释均合理或证据冲突时，允许 ABSTAIN；
  确认没有符合定义的候选应输出 OK 且 candidates=[]，不是 ABSTAIN。 ABSTAIN 不自动转 0，单独统计
  abstention_rate。

  '
